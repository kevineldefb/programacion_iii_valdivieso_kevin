<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Css</title>
    <style>
        h2 {
            color: rgb(255, 0, 0);
        }
        p {
            color: rgb(0, 255, 0);
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">
</head>
<body>
    <h1>Maneras de Incluir Estilos CSS en un archivo HTML</h1>
    <h1 style="color: rgb(38, 0, 255);">Hello World con CSS - Tipo inline</h1>
    <h2>Estilos CSS - Interno</h2>
    <p>Esta es la manera de incluir estilos tipo interno, colocando los estilos en el head del Html</p>
    <h3>Estilos CSS - Externo</h3>
    <a>Se incluyó estilo a través de un archivo externo</a>
</body>
</html>
