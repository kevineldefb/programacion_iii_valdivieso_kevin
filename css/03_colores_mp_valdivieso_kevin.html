<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores en Transporte Público</title>

    <style>
        body {
            background-color: #f1f5f9;
        }

        h1 {
            color: teal;
        }

        h2 {
            color: #be123c;
        }

        h3 {
            color: rgb(194, 65, 12);
        }

        h4 {
            color: hsl(142, 65%, 30%);
        }

        h5 {
            color: rgba(161, 98, 7, 0.8);
        }
    </style>
</head>
<body>
    <h1>Transporte Público y movilidad urbana</h1>

    <h1>Autobuses y recorridos - color por nombre</h1>

    <h2>Rutas y paradas - color hexadecimal</h2>

    <h3>Tarifas y pasajes - color RGB</h3>

    <h4>Movilidad sostenible - color HSL</h4>

    <h5>Información al usuario - color RGBA</h5>
</body>
</html>
